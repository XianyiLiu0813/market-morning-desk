  - id: ethics_research_objectivity
    name_en: "Independence & Objectivity in Research"
    name_zh: "研究的独立性与客观性"
    category: ethics
    track: cfa_foundation
    difficulty: foundation
    prerequisites: [ethics_code_standards]
    cfa_connection: ["Ethical and Professional Standards"]
    beyond_cfa_note: null
    where_used: ["卖方研究", "投资银行"]

  - id: ethics_conflicts_of_interest
    name_en: "Conflicts of Interest & Disclosure"
    name_zh: "利益冲突与披露"
    category: ethics
    track: cfa_foundation
    difficulty: foundation
    prerequisites: [ethics_code_standards]
    cfa_connection: ["Ethical and Professional Standards"]
    beyond_cfa_note: null
    where_used: ["全行业通用"]

  - id: ethics_professionalism
    name_en: "Misrepresentation & Professional Conduct"
    name_zh: "虚假陈述与职业行为"
    category: ethics
    track: cfa_foundation
    difficulty: foundation
    prerequisites: [ethics_code_standards]
    cfa_connection: ["Ethical and Professional Standards"]
