# Theme definitions (Section 11). Edit/add themes freely - no code changes needed.
# `keywords` drive simple text-matching for entity/theme mapping in MOCK_MODE
# and as a fallback signal alongside LLM-based classification.

themes:
  - key: ai_compute
    name: "AI Compute"
    description: >
      The buildout of GPU/accelerator-based compute capacity for training and
      inference of large AI models.
    keywords: ["GPU", "AI accelerator", "training cluster", "inference", "CUDA", "AI chip"]
    tickers: ["NVDA", "AMD", "AVGO", "TSM"]
    related_etfs: ["SMH", "SOXX", "QQQ"]
    upstream: ["Semiconductors", "Advanced packaging"]
    downstream: ["Cloud / Data Centers", "AI Infrastructure"]
    drivers: ["Hyperscaler capex", "Model training demand", "Enterprise AI adoption"]
    risks: ["Capex digestion pause", "Export controls", "Custom silicon substitution"]

  - key: semiconductors
    name: "Semiconductors"
    description: "Chip designers, foundries, and equipment makers broadly."
    keywords: ["semiconductor", "chip", "foundry", "wafer", "fab", "lithography"]
    tickers: ["TSM", "AVGO", "AMAT", "LRCX", "ASML"]
    related_etfs: ["SMH", "SOXX"]
    upstream: ["Equipment / materials"]
    downstream: ["AI Compute", "Memory / HBM", "Consumer electronics"]
    drivers: ["Capex cycles", "Node transitions", "End-demand recovery"]
    risks: ["Cyclicality", "Geopolitical export restrictions", "Inventory correction"]

  - key: memory_hbm
    name: "Memory / HBM"
    description: >
      DRAM/NAND memory makers and high-bandwidth memory (HBM) used in AI
      accelerators.
    keywords: ["HBM", "DRAM", "NAND", "memory pricing", "memory shortage"]
    tickers: ["MU", "SNDK"]
    related_etfs: ["SMH"]
    upstream: ["Semiconductors"]
    downstream: ["AI Compute"]
    drivers: ["AI accelerator attach rate", "Pricing discipline", "Capacity additions"]
    risks: ["Oversupply from capacity expansion", "Historically cyclical pricing"]

