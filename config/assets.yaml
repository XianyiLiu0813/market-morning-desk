# Market data universe (Section 6). Add/remove symbols freely.
# `provider_symbol` is what gets passed to the MarketDataProvider; `display`
# is what's shown in the email. Group names are used to order the dashboard.

groups:
  - group: "美股指数"
    assets:
      - { symbol: "^GSPC", display: "标普500" }
      - { symbol: "^IXIC", display: "纳斯达克综合指数" }
      - { symbol: "^NDX", display: "纳斯达克100" }
      - { symbol: "^DJI", display: "道琼斯指数" }
      - { symbol: "^RUT", display: "罗素2000" }

  - group: "港股"
    assets:
      - { symbol: "^HSI", display: "恒生指数" }
      - { symbol: "^HSTECH", display: "恒生科技指数" }

  - group: "波动率"
    assets:
      - { symbol: "^VIX", display: "VIX" }

  - group: "利率"
    assets:
      - { symbol: "US2Y", display: "美债2年期收益率" }
      - { symbol: "US10Y", display: "美债10年期收益率" }
      - { symbol: "US30Y", display: "美债30年期收益率" }
      - { symbol: "US2S10S", display: "2s10s利差" }

  - group: "外汇"
    assets:
      - { symbol: "DXY", display: "美元指数" }
      - { symbol: "USDCNH", display: "USD/CNH" }
      - { symbol: "USDJPY", display: "USD/JPY" }

  - group: "大宗商品"
    assets:
      - { symbol: "GC=F", display: "黄金" }
      - { symbol: "SI=F", display: "白银" }
      - { symbol: "CL=F", display: "WTI原油" }
      - { symbol: "BZ=F", display: "布伦特原油" }
      - { symbol: "HG=F", display: "铜" }

  - group: "加密货币"
    assets:
      - { symbol: "BTC-USD", display: "比特币" }
      - { symbol: "ETH-USD", display: "以太坊" }

  - group: "行业/主题 ETF"
    assets:
      - { symbol: "QQQ", display: "纳斯达克100 ETF (QQQ)" }
      - { symbol: "SPY", display: "标普500 ETF (SPY)" }
      - { symbol: "IWM", display: "罗素2000 ETF (IWM)" }
      - { symbol: "SMH", display: "半导体 ETF (SMH)" }
      - { symbol: "SOXX", display: "半导体 ETF (SOXX)" }
      - { symbol: "XLK", display: "科技行业 ETF (XLK)" }
      - { symbol: "XLF", display: "金融行业 ETF (XLF)" }
      - { symbol: "XLE", display: "能源行业 ETF (XLE)" }
      - { symbol: "XLY", display: "非必需消费 ETF (XLY)" }
      - { symbol: "XLP", display: "必需消费 ETF (XLP)" }
      - { symbol: "XLV", display: "医疗保健 ETF (XLV)" }
      - { symbol: "XLI", display: "工业行业 ETF (XLI)" }
      - { symbol: "XLB", display: "原材料行业 ETF (XLB)" }
      - { symbol: "XLU", display: "公用事业 ETF (XLU)" }
      - { symbol: "ARKK", display: "ARK创新 ETF (ARKK)" }
      - { symbol: "KWEB", display: "中国互联网 ETF (KWEB)" }
      - { symbol: "MCHI", display: "MSCI中国 ETF (MCHI)" }
      - { symbol: "FXI", display: "中国大盘股 ETF (FXI)" }
      - { symbol: "GDX", display: "黄金矿业股 ETF (GDX)" }
      - { symbol: "GLD", display: "黄金 ETF (GLD)" }
      - { symbol: "SLV", display: "白银 ETF (SLV)" }
