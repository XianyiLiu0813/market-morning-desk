# Default company watch universe (Section 12).
# The system does NOT require holdings/portfolio data to run - this is just
# a list of companies the analysis layer pays extra attention to when they
# appear in collected news/filings.
#
# Add your own HOLDINGS / WATCHLIST split later without changing code -
# just add a `list` field, e.g. `holdings: [...]`.

watchlist:
  # `aliases` (optional) - common press names that diverge from both the
  # ticker and the `name` field's first word, so news prose naming the
  # company (not the raw ticker) still resolves - see
  # src/processing/entity_mapping.py::build_ticker_index.
  us:
    - { ticker: "NVDA", name: "NVIDIA", aliases: ["Nvidia"] }
    - { ticker: "AMD", name: "Advanced Micro Devices" }
    - { ticker: "AVGO", name: "Broadcom" }
    - { ticker: "TSM", name: "Taiwan Semiconductor (ADR)", aliases: ["Taiwan Semiconductor", "TSMC"] }
    - { ticker: "MU", name: "Micron Technology", aliases: ["Micron"] }
    - { ticker: "MRVL", name: "Marvell Technology", aliases: ["Marvell"] }
    - { ticker: "ASML", name: "ASML Holding" }
    - { ticker: "AMAT", name: "Applied Materials" }
    - { ticker: "LRCX", name: "Lam Research" }
    - { ticker: "SNDK", name: "Sandisk" }
    - { ticker: "META", name: "Meta Platforms" }
    - { ticker: "MSFT", name: "Microsoft" }
    - { ticker: "GOOGL", name: "Alphabet", aliases: ["Google"] }
    - { ticker: "AMZN", name: "Amazon" }
    - { ticker: "TSLA", name: "Tesla" }
    - { ticker: "PLTR", name: "Palantir" }
    - { ticker: "ORCL", name: "Oracle" }
    - { ticker: "ANET", name: "Arista Networks", aliases: ["Arista"] }
    - { ticker: "CRDO", name: "Credo Technology", aliases: ["Credo"] }
    - { ticker: "AAPL", name: "Apple Inc.", aliases: ["Apple"] }

  hk_china:
    - { ticker: "9988.HK", name: "Alibaba Group", aliases: ["Alibaba"] }
    - { ticker: "0700.HK", name: "Tencent Holdings", aliases: ["Tencent"] }
    - { ticker: "1810.HK", name: "Xiaomi" }
    - { ticker: "3690.HK", name: "Meituan" }
    - { ticker: "9618.HK", name: "JD.com" }
    - { ticker: "9888.HK", name: "Baidu" }
    - { ticker: "0981.HK", name: "SMIC" }
    - { ticker: "1347.HK", name: "Hua Hong Semiconductor" }

  # Data access permitting (often limited without a specialized data vendor).
  optional_foreign:
    - { ticker: "000660.KS", name: "SK Hynix" }
    - { ticker: "005930.KS", name: "Samsung Electronics", aliases: ["Samsung"] }
